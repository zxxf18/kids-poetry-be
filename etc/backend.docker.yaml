Name: kids-poetry-api
Host: 0.0.0.0
Port: 8890
Timeout: 10000
Database:
  DSN: ${POETRY_DB_DSN}
Audio:
  Endpoint: ${POETRY_AUDIO_MINIO_ENDPOINT}
  AccessKey: ${POETRY_AUDIO_MINIO_ACCESS_KEY}
  SecretKey: ${POETRY_AUDIO_MINIO_SECRET_KEY}
  Bucket: ${POETRY_AUDIO_MINIO_BUCKET}
  UseSSL: false
App:
  DatasetVersion: ${POETRY_DATASET_VERSION}
OIDC:
  Issuer: ${POETRY_OIDC_ISSUER}
  ClientID: ${POETRY_OIDC_CLIENT_ID}
  ClientSecret: ${POETRY_OIDC_CLIENT_SECRET}
  RedirectURL: ${POETRY_OIDC_REDIRECT_URL}
  SessionSecret: ${POETRY_OIDC_SESSION_SECRET}
  CookieName: poetry_session
  AdminEmails: ${POETRY_ADMIN_EMAILS}
